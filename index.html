<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FedEx Team Time-Off Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const ADMIN_PASSWORD = "admin"; 
        const firebaseConfig = {
            apiKey: "AizaSyd69nsBI1l0gdAwrbRONO4aRyNuakZRvHo",
            authDomain: "paltimeoff.firebaseapp.com",
            projectId: "paltimeoff",
            storageBucket: "paltimeoff.firebasestorage.app",
            messagingSenderId: "461729759997",
            appId: "1:461729759997:web:ff333d9259518d66f1b494"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentRole = null;
        let driverName = "";
        let currentDate = new Date();
        let selectedStart = null;
        let selectedEnd = null;
        let allRequests = [];
        let unsubscribeDatabase = null;
        let inspectedDateGlobal = null;

        function getHolidaysForYear(year) {
            const staticHolidays = {
                [`${year}-01-01`]: "New Year's Day",
                [`${year}-07-04`]: "Independence Day",
                [`${year}-12-24`]: "Christmas Eve",
                [`${year}-12-25`]: "Christmas Day"
            };
            const findNthDayOfMonth = (year, month, dayOfWeek, nth) => {
                let count = 0;
                let date = new Date(year, month, 1);
                while (date.getMonth() === month) {
                    if (date.getDay() === dayOfWeek) {
                        count++;
                        if (count === nth) return date;
                    }
                    date.setDate(date.getDate() + 1);
                }
                return null;
            };
            const findLastDayOfMonth = (year, month, dayOfWeek) => {
                let date = new Date(year, month + 1, 0);
                while (date.getMonth() === month) {
                    if (date.getDay() === dayOfWeek) return date;
                    date.setDate(date.getDate() - 1);
                }
                return null;
            };
            const formatDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const memorialDay = findLastDayOfMonth(year, 4, 1); 
            const laborDay = findNthDayOfMonth(year, 8, 1, 1);    
            const thanksgiving = findNthDayOfMonth(year, 10, 4, 4); 
            if (memorialDay) staticHolidays[formatDate(memorialDay)] = "Memorial Day";
            if (laborDay) staticHolidays[formatDate(laborDay)] = "Labor Day";
            if (thanksgiving) staticHolidays[formatDate(thanksgiving)] = "Thanksgiving Day";
            return staticHolidays;
        }

        window.selectRole = (role) => {
            if (role === 'admin') document.getElementById('adminAuthModal').classList.remove('hidden');
            else document.getElementById('driverAuthModal').classList.remove('hidden');
        };

        window.submitAdminAuth = () => {
            if (document.getElementById('adminPassInput').value === ADMIN_PASSWORD) {
                currentRole = 'admin';
                document.getElementById('adminBadge').classList.remove('hidden');
                initApp();
            } else alert("Incorrect password.");
        };

        window.submitDriverAuth = () => {
            const name = document.getElementById('driverNameInput').value.trim();
            if (name) {
                driverName = name;
                currentRole = 'driver';
                document.getElementById('driverBadge').classList.remove('hidden');
                document.getElementById('driverBadge').innerText = `Driver: ${driverName}`;
                initApp();
            } else alert("Please enter your name.");
        };

        function initApp() {
            document.getElementById('roleModal').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('opacity-0');
            setupDropdowns();
            listenToDatabase();
        }

        function setupDropdowns() {
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('monthSelect').innerHTML = months.map((m, i) => `<option value="${i}" ${i === currentDate.getMonth() ? 'selected' : ''}>${m}</option>`).join('');
            const currentYear = new Date().getFullYear();
            document.getElementById('yearSelect').innerHTML = [currentYear, currentYear + 1, currentYear + 2].map(y => `<option value="${y}" ${y === currentDate.getFullYear() ? 'selected' : ''}>${y}</option>`).join('');
        }

        function listenToDatabase() {
            if (unsubscribeDatabase) unsubscribeDatabase();
            unsubscribeDatabase = onSnapshot(query(collection(db, "timeoff")), (snapshot) => {
                allRequests = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderCalendar();
                if (currentRole === 'admin') updateInspector();
            });
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const activeHolidays = getHolidaysForYear(year);
            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) grid.appendChild(document.createElement('div'));

            for (let day = 1; day <= totalDays; day++) {
                const dayDiv = document.createElement('div');
                const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayMatches = allRequests.filter(req => req.status !== 'denied' && dateString >= req.start && dateString <= req.end);
                
                dayDiv.className = "relative border border-slate-700 bg-slate-800 rounded-lg flex flex-col p-1 cursor-pointer hover:bg-slate-700 aspect-square transition-all text-xs font-bold";
                
                // --- MULTI-REQUEST INDICATOR ---
                if (dayMatches.length > 1) {
                    dayDiv.innerHTML = `<span class="absolute top-1 right-1 bg-amber-500 text-[9px] text-slate-900 font-black rounded-full w-4 h-4 flex items-center justify-center z-20">${dayMatches.length}</span>`;
                }

                dayDiv.innerHTML += `<span class="z-10">${day}</span>`;
                
                if (dayMatches.length > 0) {
                    dayDiv.classList.add(dayMatches.some(r => r.status === 'approved') ? 'bg-red-900/30 border-red-700' : 'bg-blue-900/30 border-blue-700');
                }

                dayDiv.onclick = () => (currentRole === 'driver') ? handleDriverDateSelection(dateString, activeHolidays[dateString]) : handleAdminInspection(dateString);
                grid.appendChild(dayDiv);
            }
        }

        window.handleDriverDateSelection = (dateStr, isHoliday) => {
            if (isHoliday) alert(`⚠️ This date is during ${isHoliday}.`);
            if (!selectedStart || (selectedStart && selectedEnd)) { selectedStart = dateStr; selectedEnd = null; }
            else if (dateStr < selectedStart) selectedStart = dateStr;
            else selectedEnd = dateStr;
            renderCalendar();
            updateDriverActionPanel();
        };

        window.updateDriverActionPanel = () => {
            const panel = document.getElementById('driverActionPanel');
            if (!selectedStart) { panel.innerHTML = `<p class="text-slate-400 text-center text-xs italic">Tap start then end date.</p>`; return; }
            panel.innerHTML = `<p class="text-xs text-center font-bold">Selected: ${selectedStart} to ${selectedEnd || selectedStart}</p>
                               <button onclick="submitTimeOffRequest()" class="w-full mt-2 bg-emerald-600 py-2 rounded-lg font-bold text-xs">Submit</button>
                               <button onclick="clearDriverSelection()" class="w-full mt-1 text-[10px] text-slate-500 underline">Clear</button>`;
        };

        window.clearDriverSelection = () => { selectedStart = null; selectedEnd = null; renderCalendar(); updateDriverActionPanel(); };

        window.submitTimeOffRequest = async () => {
            await addDoc(collection(db, "timeoff"), { name: driverName, start: selectedStart, end: selectedEnd || selectedStart, status: 'pending', timestamp: Date.now() });
            alert("Request submitted!");
            clearDriverSelection();
        };

        window.handleAdminInspection = (dateStr) => { inspectedDateGlobal = dateStr; updateInspector(); };

        function updateInspector() {
            if (!inspectedDateGlobal) return;
            const matches = allRequests.filter(req => inspectedDateGlobal >= req.start && inspectedDateGlobal <= req.end);
            document.getElementById('inspectorPanel').innerHTML = `<h3 class="font-bold text-sm mb-2">${inspectedDateGlobal}</h3>` + 
                (matches.length ? matches.map(m => `<div class="bg-slate-800 p-1 text-[10px] border-l-2 mb-1 ${m.status === 'approved' ? 'border-emerald-500' : 'border-blue-500'}">${m.name}</div>`).join('') : '<p class="text-[10px]">No requests.</p>');
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 p-4">
    <div id="roleModal" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center">
        <h1 class="text-2xl font-black mb-8">FedEx Team Time-Off</h1>
        <div class="flex gap-4">
            <button onclick="selectRole('driver')" class="bg-slate-900 border border-slate-700 px-8 py-4 rounded-xl font-bold">Driver</button>
            <button onclick="selectRole('admin')" class="bg-slate-900 border border-slate-700 px-8 py-4 rounded-xl font-bold">Admin</button>
        </div>
        <div id="adminAuthModal" class="hidden mt-4"><input type="password" id="adminPassInput" class="bg-slate-800 p-2 text-white" placeholder="Pass"><button onclick="submitAdminAuth()">Log In</button></div>
        <div id="driverAuthModal" class="hidden mt-4"><input type="text" id="driverNameInput" class="bg-slate-800 p-2 text-white" placeholder="Name"><button onclick="submitDriverAuth()">Enter</button></div>
    </div>

    <div id="mainApp" class="opacity-0 max-w-4xl mx-auto">
        <header class="flex justify-between pb-4">
            <div id="adminBadge" class="hidden bg-indigo-900 px-2 py-1 text-xs font-bold">ADMIN</div>
            <div id="driverBadge" class="hidden bg-emerald-900 px-2 py-1 text-xs font-bold"></div>
            <div class="flex gap-2">
                <select id="monthSelect" class="bg-slate-800 p-1 text-xs"></select>
                <select id="yearSelect" class="bg-slate-800 p-1 text-xs"></select>
            </div>
        </header>
        <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <section class="md:col-span-2">
                <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
            </section>
            <section>
                <div id="inspectorPanel" class="bg-slate-900 p-4 rounded-xl"></div>
                <div id="driverActionPanel" class="bg-slate-900 p-4 rounded-xl mt-4"></div>
            </section>
        </main>
    </div>
</body>
</html>
