<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FedEx Team Time-Off Tracker</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // CONFIGURATION: PASSSWORD & YOUR APPLIED FIREBASE CREDENTIALS
        // ==========================================
        const ADMIN_PASSWORD = "FedexAdmin2026!"; // <-- Change your Admin password here if needed!

        const firebaseConfig = {
            apiKey: "AizaSyd69nsBI1l0gdAwrbRONO4aRyNuakZRvHo",
            authDomain: "paltimeoff.firebaseapp.com",
            projectId: "paltimeoff",
            storageBucket: "paltimeoff.firebasestorage.app",
            messagingSenderId: "461729759997",
            appId: "1:461729759997:web:ff333d9259518d66f1b494"
        };
        // ==========================================

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Core State
        let currentRole = null;
        let driverName = "";
        let currentDate = new Date();
        let selectedStart = null;
        let selectedEnd = null;
        let allRequests = [];

        // Main Stream North American/Bank Holidays List
        const holidays = {
            "1-1": "New Year's Day",
            "4-5": "Easter Sunday", 
            "5-25": "Memorial Day",
            "7-4": "Independence Day",
            "9-7": "Labor Day",
            "11-26": "Thanksgiving Day",
            "12-24": "Christmas Eve",
            "12-25": "Christmas Day"
        };

        // DOM Elements
        const roleModal = document.getElementById('roleModal');
        const adminAuthModal = document.getElementById('adminAuthModal');
        const driverAuthModal = document.getElementById('driverAuthModal');
        const mainApp = document.getElementById('mainApp');
        const calendarGrid = document.getElementById('calendarGrid');
        const monthSelect = document.getElementById('monthSelect');
        const yearSelect = document.getElementById('yearSelect');
        const inspectorPanel = document.getElementById('inspectorPanel');
        const driverActionPanel = document.getElementById('driverActionPanel');

        // Global Setup & Window assignments for HTML buttons
        window.selectRole = function(role) {
            if (role === 'admin') {
                adminAuthModal.classList.remove('hidden');
            } else {
                driverAuthModal.classList.remove('hidden');
            }
        };

        window.submitAdminAuth = function() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === ADMIN_PASSWORD) {
                currentRole = 'admin';
                document.getElementById('adminBadge').classList.remove('hidden');
                initApp();
            } else {
                alert("Incorrect password.");
            }
        };

        window.submitDriverAuth = function() {
            const name = document.getElementById('driverNameInput').value.trim();
            if (name) {
                driverName = name;
                currentRole = 'driver';
                document.getElementById('driverBadge').classList.remove('hidden');
                document.getElementById('driverBadge').innerText = `Driver: ${driverName}`;
                initApp();
            } else {
                alert("Please enter your name.");
            }
        };

        function initApp() {
            roleModal.classList.add('hidden');
            adminAuthModal.classList.add('hidden');
            driverAuthModal.classList.add('hidden');
            mainApp.classList.remove('opacity-0');
            
            setupDropdowns();
            listenToDatabase();
        }

        function setupDropdowns() {
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            monthSelect.innerHTML = months.map((m, i) => `<option value="${i}" ${i === currentDate.getMonth() ? 'selected' : ''}>${m}</option>`).join('');
            
            const currentYear = new Date().getFullYear();
            const years = [currentYear, currentYear + 1, currentYear + 2];
            yearSelect.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');

            monthSelect.addEventListener('change', () => { currentDate.setMonth(monthSelect.value); renderCalendar(); });
            yearSelect.addEventListener('change', () => { currentDate.setFullYear(yearSelect.value); renderCalendar(); });
        }

        // Real-time Database Sync Listener
        function listenToDatabase() {
            onSnapshot(collection(db, "timeoff"), (snapshot) => {
                allRequests = [];
                snapshot.forEach((doc) => {
                    allRequests.push({ id: doc.id, ...doc.data() });
                });
                renderCalendar();
                if (currentRole === 'admin') updateInspector();
            });
        }

        function renderCalendar() {
            calendarGrid.innerHTML = '';
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            // Blank padding days for grid alignment
            for (let i = 0; i < firstDayIndex; i++) {
                calendarGrid.appendChild(document.createElement('div'));
            }

            // Build individual Day Nodes
            for (let day = 1; day <= totalDays; day++) {
                const dayDiv = document.createElement('div');
                const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const holidayKey = `${month + 1}-${day}`;

                dayDiv.className = "relative border border-slate-700 bg-slate-800 rounded-lg flex flex-col justify-between p-2 cursor-pointer select-none transition-all hover:bg-slate-700 min-h-[65px] h-full overflow-hidden font-bold text-sm text-slate-200";
                dayDiv.innerHTML = `<span>${day}</span>`;

                // Handle Main Stream Holiday Flags
                if (holidays[holidayKey]) {
                    dayDiv.classList.add('bg-amber-950/40', 'border-amber-500/50');
                    dayDiv.innerHTML += `<span class="text-[9px] text-amber-400 bg-amber-900/80 px-1 rounded truncate absolute bottom-1 left-1 right-1">Talk to Josh/Matt</span>`;
                }

                // Scan database matchings for this specific date
                const dayMatches = allRequests.filter(req => dateString >= req.start && dateString <= req.end);
                const approvedMatches = dayMatches.filter(r => r.status === 'approved');
                const pendingMatches = dayMatches.filter(r => r.status === 'pending');

                if (approvedMatches.length > 0) {
                    dayDiv.classList.remove('bg-slate-800');
                    dayDiv.classList.add('bg-red-950', 'border-red-600', 'text-red-200');
                    dayDiv.innerHTML += `<span class="text-[10px] text-red-400 block truncate font-black text-center">${approvedMatches[0].name}${approvedMatches.length > 1 ? ' +'+(approvedMatches.length-1) : ''}</span>`;
                } else if (pendingMatches.length > 0) {
                    dayDiv.classList.add('ring-1', 'ring-blue-500/50');
                    dayDiv.innerHTML += `<span class="text-[9px] text-blue-400 text-center font-medium bg-blue-950/80 rounded px-0.5 truncate">${pendingMatches.length} Pending</span>`;
                }

                // Visual Highlight Selection Logic for Drivers
                if (currentRole === 'driver' && selectedStart) {
                    if (dateString === selectedStart || (selectedEnd && dateString >= selectedStart && dateString <= selectedEnd)) {
                        dayDiv.classList.add('ring-2', 'ring-emerald-400', 'bg-emerald-950/50');
                    }
                }

                // Click Actions based on Access Layer
                dayDiv.addEventListener('click', () => {
                    if (currentRole === 'driver') {
                        handleDriverDateSelection(dateString, holidays[holidayKey]);
                    } else if (currentRole === 'admin') {
                        handleAdminInspection(dateString);
                    }
                });

                calendarGrid.appendChild(dayDiv);
            }
        }

        function handleDriverDateSelection(dateStr, isHoliday) {
            if (isHoliday) {
                alert(`⚠️ This date is during ${isHoliday}. You must speak directly to Josh or Matt to secure this request.`);
            }

            if (!selectedStart || (selectedStart && selectedEnd)) {
                selectedStart = dateStr;
                selectedEnd = null;
            } else if (dateStr < selectedStart) {
                selectedStart = dateStr;
            } else {
                selectedEnd = dateStr;
            }
            
            renderCalendar();
            updateDriverActionPanel();
        }

        function updateDriverActionPanel() {
            if (!selectedStart) {
                driverActionPanel.innerHTML = `<p class="text-slate-400 text-center text-sm italic">Tap a start date, then an end date to select your range.</p>`;
                return;
            }

            const rangeText = selectedEnd ? `${selectedStart} to ${selectedEnd}` : `${selectedStart} (Select End Date)`;
            const hasConflict = allRequests.some(req => req.status === 'approved' && ((selectedStart >= req.start && selectedStart <= req.end) || (selectedEnd && selectedEnd >= req.start && selectedEnd <= req.end)));

            let WarningBanner = hasConflict ? `
                <div class="bg-red-950/60 border border-red-700 rounded p-2 mb-2 text-xs text-red-300">
                    ⚠️ Notice: This slot is currently occupied by an approved request. Your request can still be submitted, but expects potential denial unless you make a case directly to Josh or Matt.
                </div>
            ` : '';

            driverActionPanel.innerHTML = `
                ${WarningBanner}
                <div class="flex flex-col gap-2">
                    <p class="text-sm font-bold">Selected: <span class="text-emerald-400">${rangeText}</span></p>
                    <div class="flex gap-2">
                        <button onclick="submitTimeOffRequest(false)" class="flex-1 bg-emerald-600 hover:bg-emerald-500 font-bold py-2 rounded text-sm transition-all shadow-md">Submit Request</button>
                        <button onclick="submitTimeOffRequest(true)" class="bg-slate-700 hover:bg-slate-600 font-bold px-3 py-2 rounded text-xs transition-all border border-slate-600 text-slate-300">+ Add Another Range</button>
                    </div>
                </div>
            `;
        }

        window.submitTimeOffRequest = async function(addMore) {
            if (!selectedStart) return;
            const end = selectedEnd ? selectedEnd : selectedStart;

            await addDoc(collection(db, "timeoff"), {
                name: driverName,
                start: selectedStart,
                end: end,
                status: 'pending',
                timestamp: Date.now()
            });

            selectedStart = null;
            selectedEnd = null;
            
            if (!addMore) {
                alert("Request successfully submitted to Admin dashboard!");
                updateDriverActionPanel();
            } else {
                renderCalendar();
                updateDriverActionPanel();
            }
        };

        // Admin Inspector Layer Logic
        let inspectedDateGlobal = null;
        function handleAdminInspection(dateStr) {
            inspectedDateGlobal = dateStr;
            updateInspector();
        }

        function updateInspector() {
            if (!inspectedDateGlobal) {
                inspectorPanel.innerHTML = `<p class="text-slate-400 text-sm text-center italic mt-10">Click any calendar date to inspect requests.</p>`;
                return;
            }

            const matchRequests = allRequests.filter(req => inspectedDateGlobal >= req.start && inspectedDateGlobal <= req.end);
            
            let html = `<h3 class="font-black text-slate-100 border-b border-slate-700 pb-2 mb-3 text-base">Date: ${inspectedDateGlobal}</h3>`;
            
            if (matchRequests.length === 0) {
                html += `<p class="text-slate-500 text-sm italic">No active requests for this day.</p>`;
            } else {
                html += `<div class="space-y-3 max-h-[75vh] overflow-y-auto pr-1">`;
                matchRequests.forEach(req => {
                    const statusColor = req.status === 'approved' ? 'bg-red-500/20 text-red-400 border-red-500' : 'bg-blue-500/10 text-blue-400 border-blue-500/50';
                    html += `
                        <div class="p-3 bg-slate-800 border-l-4 ${statusColor} rounded-r flex flex-col gap-2 shadow-sm">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="font-black text-slate-200 text-sm">${req.name}</p>
                                    <p class="text-[11px] text-slate-400">${req.start} to ${req.end}</p>
                                </div>
                                <span class="text-[10px] uppercase tracking-wider font-bold">${req.status}</span>
                            </div>
                            <div class="flex gap-2 justify-end mt-1">
                                ${req.status === 'pending' ? `<button onclick="processRequest('${req.id}', 'approved')" class="bg-emerald-600 hover:bg-emerald-500 text-xs font-bold px-2.5 py-1 rounded transition-all text-white">Approve</button>` : ''}
                                <button onclick="deleteRequest('${req.id}')" class="bg-rose-700 hover:bg-rose-600 text-xs font-bold px-2.5 py-1 rounded transition-all text-white">${req.status === 'approved' ? 'Revoke / Deny' : 'Deny'}</button>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            inspectorPanel.innerHTML = html;
        }

        window.processRequest = async function(id, newStatus) {
            const docRef = doc(db, "timeoff", id);
            await updateDoc(docRef, { status: newStatus });
        };

        window.deleteRequest = async function(id) {
            if (confirm("Are you sure you want to deny/remove this request?")) {
                const docRef = doc(db, "timeoff", id);
                await deleteDoc(docRef);
            }
        };
    </script>

    <style>
        /* Disables mobile rubber-banding behavior to lock screen constraints */
        html, body {
            overflow: hidden;
            height: 100%;
            position: relative;
            background-color: #0f172a;
        }
    </style>
</head>
<body class="text-slate-100 font-sans selection:bg-emerald-500 selection:text-slate-900">

    <div id="roleModal" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-4">
        <h1 class="text-3xl font-black tracking-tight mb-8 text-center text-slate-100 uppercase">FedEx Team Time-Off Portal</h1>
        <div class="flex flex-col sm:flex-row gap-4 w-full max-w-md">
            <button onclick="selectRole('driver')" class="flex-1 bg-slate-800 hover:bg-slate-700 border-2 border-slate-600 rounded-2xl py-12 text-2xl font-black tracking-wide shadow-xl active:scale-95 transition-all text-emerald-400">DRIVER</button>
            <button onclick="selectRole('admin')" class="flex-1 bg-slate-800 hover:bg-slate-700 border-2 border-slate-600 rounded-2xl py-12 text-2xl font-black tracking-wide shadow-xl active:scale-95 transition-all text-indigo-400">ADMIN</button>
        </div>

        <div id="adminAuthModal" class="hidden mt-8 w-full max-w-sm bg-slate-900 border border-slate-700 rounded-xl p-4 shadow-2xl">
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Enter Secure Passphrase</label>
            <input type="password" id="adminPassInput" class="w-full bg-slate-800 border border-slate-600 rounded p-2.5 mb-3 font-bold focus:outline-none focus:border-indigo-500 text-center" placeholder="••••••••">
            <button onclick="submitAdminAuth()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded-lg transition-all shadow-md">Authorize Access</button>
        </div>

        <div id="driverAuthModal" class="hidden mt-8 w-full max-w-sm bg-slate-900 border border-slate-700 rounded-xl p-4 shadow-2xl">
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Your Full Name</label>
            <input type="text" id="driverNameInput" class="w-full bg-slate-800 border border-slate-600 rounded p-2.5 mb-3 font-bold focus:outline-none focus:border-emerald-500 text-center" placeholder="e.g. John Doe">
            <button onclick="submitDriverAuth()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-lg transition-all shadow-md">Open Calendar</button>
        </div>
    </div>

    <div id="mainApp" class="opacity-0 transition-opacity duration-300 h-screen flex flex-col p-3 max-w-7xl mx-auto">
        
        <header class="flex justify-between items-center border-b border-slate-800 pb-2 mb-2 flex-shrink-0">
            <div class="flex items-center gap-3">
                <h2 class="text-lg font-black uppercase tracking-tight text-slate-200">Time-Off Framework</h2>
                <span id="adminBadge" class="hidden bg-indigo-900/80 text-indigo-300 border border-indigo-700 px-2 py-0.5 rounded text-xs font-bold uppercase tracking-wider">Admin</span>
                <span id="driverBadge" class="hidden bg-emerald-900/80 text-emerald-300 border border-emerald-700 px-2 py-0.5 rounded text-xs font-bold uppercase tracking-wider"></span>
            </div>
            
            <div class="flex gap-2">
                <select id="monthSelect" class="bg-slate-800 border border-slate-700 rounded font-bold text-xs p-1.5 focus:outline-none focus:border-emerald-500 text-slate-200"></select>
                <select id="yearSelect" class="bg-slate-800 border border-slate-700 rounded font-bold text-xs p-1.5 focus:outline-none focus:border-emerald-500 text-slate-200"></select>
            </div>
        </header>

        <main class="flex-1 grid grid-cols-1 md:grid-cols-10 gap-3 min-h-0 overflow-hidden">
            
            <section class="md:col-span-6 flex flex-col min-h-0 bg-slate-900 border border-slate-800 rounded-xl p-3 shadow-lg">
                <div class="grid grid-cols-7 gap-1 text-center font-black text-[11px] tracking-wider text-slate-400 uppercase mb-2 flex-shrink-0">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div id="calendarGrid" class="flex-1 grid grid-cols-7 auto-rows-fr gap-1 min-h-0 overflow-hidden">
                    </div>
            </section>

            <section class="md:col-span-4 flex flex-col min-h-0 bg-slate-900 border border-slate-800 rounded-xl p-3 shadow-lg">
                <div class="h-full flex flex-col justify-between min-h-0">
                    <div id="inspectorPanel" class="flex-1 min-h-0">
                        <p class="text-slate-400 text-sm text-center italic mt-10">System successfully synchronized.</p>
                    </div>
                    
                    <div id="driverActionPanel" class="border-t border-slate-800 pt-3 mt-2 flex-shrink-0">
                        <p class="text-slate-400 text-center text-sm italic">Tap a start date, then an end date to select your range.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
